name: Supabase Keep Alive

on:
  schedule:
    # Runs every Monday at 09:00 UTC (02:30 PM IST)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Check Status and Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Use user-configured secrets if present, otherwise fallback to default values from application configs
          URL="${SUPABASE_URL:-https://cruxppwwdjudpzdsoemd.supabase.co}"
          ANON_KEY="${SUPABASE_ANON_KEY:-sb_publishable_ODAUQowKiS36ONqKOXfDtw_p1BanbJ3}"
          
          echo "Sending weekly ping request to Supabase to keep database active..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${URL}/rest/v1/settings?select=*" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}")
          
          echo "Response HTTP Status Code: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success! Database is active and keep-alive ping succeeded."
          else
            echo "Error: Keep-alive request failed with status code ${HTTP_STATUS}"
            exit 1
          fi
